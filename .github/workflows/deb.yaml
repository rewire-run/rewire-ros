name: deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: deb-${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: ros:${{ matrix.distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy, kilted, lyrical]
    steps:
      - uses: actions/checkout@v5

      - name: Build the deb
        run: scripts/build-deb.sh ${{ matrix.distro }} ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Install it, letting apt pull rewire in
        run: scripts/test-deb.sh ${{ matrix.distro }} ros-${{ matrix.distro }}-rewire-ros_*_all.deb

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.distro }}
          path: "*.deb"

  release:
    name: attach-to-release
    needs: deb
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true
          path: debs

      - uses: softprops/action-gh-release@v3
        with:
          files: "debs/*.deb"
